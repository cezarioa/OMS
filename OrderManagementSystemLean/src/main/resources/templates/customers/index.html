<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers - OMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/customers">Customers</a>
    <a href="/orders">Orders</a>
    <a href="/contracts">Contracts</a>
    <a href="/sellable-items">Items</a>
</nav>

<div class="container">
    <h1>Customers</h1>

    <div class="filter-panel">
        <form action="/customers" method="get" class="filter-grid">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${name}" placeholder="Search by name">
            </div>
            <div>
                <label for="currency">Currency</label>
                <input type="text" id="currency" name="currency" th:value="${currency}" placeholder="ISO code">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" th:value="${email}" placeholder="Email contains...">
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Filter</button>
                <a href="/customers" class="btn btn-link">Reset</a>
            </div>
            <input type="hidden" name="sortBy" th:value="${sortBy}">
            <input type="hidden" name="sortDir" th:value="${sortDir}">
        </form>
    </div>

    <p>
        <a href="/customers/new" class="btn btn-primary">Add New Customer</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>
                <a th:href="@{/customers(sortBy='id', sortDir=${sortBy == 'id' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, currency=${currency}, email=${email})}">
                    ID <span th:if="${sortBy == 'id'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/customers(sortBy='name', sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, currency=${currency}, email=${email})}">
                    Name <span th:if="${sortBy == 'name'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/customers(sortBy='currency', sortDir=${sortBy == 'currency' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, currency=${currency}, email=${email})}">
                    Currency <span th:if="${sortBy == 'currency'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/customers(sortBy='email', sortDir=${sortBy == 'email' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, currency=${currency}, email=${email})}">
                    Email <span th:if="${sortBy == 'email'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cust : ${customers}">
            <td th:text="${cust.id}">1</td>
            <td th:text="${cust.name}">Customer</td>
            <td th:text="${cust.currency}">EUR</td>
            <td th:text="${cust.email}">contact@example.com</td>
            <td>
                <a th:href="@{/customers/{id}(id=${cust.id})}" class="btn btn-primary" style="margin-right: 5px;">Details</a>
                <a th:href="@{/customers/{id}/edit(id=${cust.id})}" class="btn btn-primary" style="margin-right: 5px;">Edit</a>
                <form th:action="@{/customers/{id}/delete(id=${cust.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete" onclick="return confirm('Delete this customer?');">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(customers)}">
            <td colspan="5" style="text-align:center;">No customers found matching the criteria.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
