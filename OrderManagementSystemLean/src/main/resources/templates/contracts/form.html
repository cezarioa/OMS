<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contract</title>
    <style>
        label { display: inline-block; width: 160px; margin-bottom: 6px; }
        input { padding: 4px; }
        .row { margin: 6px 0; }
    </style>
</head>
<body>

<h1>Create Contract</h1>
<p>
    <a href="/contracts">Back to Contracts</a>
</p>

<form th:action="@{/contracts}" th:object="${contract}" method="post">
    <div class="row">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" />
    </div>

    <div class="row">
        <label for="status">Status:</label>
        <input type="text" id="status" th:field="*{status}" />
    </div>

    <div class="row">
        <label for="contractTypeId">Contract Type ID:</label>
        <input type="number" id="contractTypeId" th:field="*{contractTypeId}" />
    </div>

    <div class="row">
        <button type="submit">Save</button>
    </div>
</form>

</body>
</html>
