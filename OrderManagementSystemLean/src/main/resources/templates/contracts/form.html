<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contract</title>
    <style>
        .navbar { background-color: #005a9c; padding: 15px 30px; color: white; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-right: 20px; }
        .navbar a:hover { text-decoration: underline; }
        .row { margin: 10px 0; }
        label { display: inline-block; width: 160px; }
        .error { color: #dc3545; font-size: 0.85em; margin-left: 160px; display: block; }
        .lines-section { margin-top: 24px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fff; }
        .lines-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .lines-table th, .lines-table td { padding: 6px 4px; border: 1px solid #d9dde1; text-align: left; }
        .lines-table th { background-color: #f0f4f8; }
        .lines-table select, .lines-table input { width: 100%; }
        .unit-value { font-weight: 600; color: #004a80; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/customers">Customers</a>
    <a href="/orders">Orders</a>
    <a href="/contracts">Contracts</a>
    <a href="/sellable-items">Items</a>
</nav>

<h1 th:text="${contract.id != null ? 'Edit Contract' : 'Create Contract'}">Create Contract</h1>
<p><a href="/contracts">Back to Contracts</a></p>

<form th:action="@{/contracts}" th:object="${contract}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div class="row">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" />
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>
    </div>

    <div class="row">
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option th:each="status : ${statusOptions}"
                    th:value="${status}"
                    th:text="${status}">ACTIVE</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Status error</span>
    </div>

    <div class="row">
        <label for="contractTypeSelect">Contract Type:</label>
        <select id="contractTypeSelect" th:field="*{contractType.id}">
            <option value="" disabled>Select a type</option>
            <option th:each="ctype : ${contractTypes}"
                    th:value="${ctype.id}"
                    th:text="${ctype.name + ' (' + ctype.type + ')'}">
                Standard Customer Contract
            </option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('contractType.id')}" th:errors="*{contractType.id}">Contract type error</span>
    </div>
    <div class="lines-section">
        <h2>Contract Lines</h2>
        <p>Define the product or service scope for this contract.</p>
        <table class="lines-table">
            <thead>
            <tr>
                <th>Item / Service</th>
                <th>Unit</th>
                <th>Quantity</th>
                <th>Unit Value</th>
                <th style="width: 90px;">Remove</th>
            </tr>
            </thead>
            <tbody id="contractLinesBody" th:data-next-index="${#lists.size(contract.contractLines)}">
            <tr th:each="line, iterStat : ${contract.contractLines}">
                <td>
                    <input type="hidden" th:field="*{contractLines[__${iterStat.index}__].id}" />
                    <select th:field="*{contractLines[__${iterStat.index}__].item}">
                        <option value="">Choose item</option>
                        <option th:each="item : ${sellableItems}"
                                th:value="${item.id}"
                                th:text="${item.name}">
                            Item
                        </option>
                    </select>
                    <span class="error"
                          th:if="${#fields.hasErrors('contractLines[' + iterStat.index + '].item')}"
                          th:errors="*{contractLines[__${iterStat.index}__].item}">Item error</span>
                </td>
                <td>
                    <select th:field="*{contractLines[__${iterStat.index}__].unit}">
                        <option value="">Choose unit</option>
                        <option th:each="unit : ${units}"
                                th:value="${unit.id}"
                                th:text="${unit.symbol != null ? unit.symbol : unit.name}">
                            EA
                        </option>
                    </select>
                    <span class="error"
                          th:if="${#fields.hasErrors('contractLines[' + iterStat.index + '].unit')}"
                          th:errors="*{contractLines[__${iterStat.index}__].unit}">Unit error</span>
                </td>
                <td>
                    <input type="number" step="1" min="1" placeholder="Qty"
                           th:field="*{contractLines[__${iterStat.index}__].quantity}" />
                    <span class="error"
                          th:if="${#fields.hasErrors('contractLines[' + iterStat.index + '].quantity')}"
                          th:errors="*{contractLines[__${iterStat.index}__].quantity}">Quantity error</span>
                </td>
                <td>
                    <span class="unit-value"
                          th:text="${line.item != null ? line.item.unitValue : 0.0}">0.0</span>
                </td>
                <td>
                    <button type="button" class="btn btn-link delete-line" style="color:#dc3545; padding:0;">Remove</button>
                </td>
            </tr>
            </tbody>
        </table>
        <button type="button" id="add-contract-line" class="btn btn-primary" style="margin-top: 12px;">Add another line</button>
    </div>
    <div class="row">
        <button type="submit">Save</button>
    </div>
</form>

<script type="text/template" id="contractLineTemplate">
    <tr>
        <td>
            <input type="hidden" name="contractLines[__index__].id" value="" />
            <select name="contractLines[__index__].item">
                <option value="">Choose item</option>
                <option th:each="item : ${sellableItems}"
                        th:value="${item.id}"
                        th:text="${item.name}">
                    Item
                </option>
            </select>
        </td>
        <td>
            <select name="contractLines[__index__].unit">
                <option value="">Choose unit</option>
                <option th:each="unit : ${units}"
                        th:value="${unit.id}"
                        th:text="${unit.symbol != null ? unit.symbol : unit.name}">
                    Unit
                </option>
            </select>
        </td>
        <td>
            <input type="number" step="1" min="1" name="contractLines[__index__].quantity" value="" placeholder="Qty"/>
        </td>
        <td>
            <span class="unit-value">0.0</span>
        </td>
        <td>
            <button type="button" class="btn btn-link delete-line" style="color:#dc3545; padding:0;">Remove</button>
        </td>
    </tr>
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const contractLinesBody = document.getElementById('contractLinesBody');
    const addContractLineButton = document.getElementById('add-contract-line');
    if (contractLinesBody && addContractLineButton) {
        let nextIndex = parseInt(contractLinesBody.dataset.nextIndex, 10);
        if (isNaN(nextIndex)) {
            nextIndex = 0;
        }
        const template = document.getElementById('contractLineTemplate').innerHTML.trim();
        addContractLineButton.addEventListener('click', () => {
            const rowHtml = template.replace(/__index__/g, nextIndex);
            contractLinesBody.insertAdjacentHTML('beforeend', rowHtml);
            nextIndex++;
            contractLinesBody.dataset.nextIndex = nextIndex;
        });
        contractLinesBody.addEventListener('click', event => {
            if (event.target.matches('.delete-line')) {
                const row = event.target.closest('tr');
                if (row) row.remove();
            }
        });
    }
    /*]]>*/
</script>

</body>
</html>
