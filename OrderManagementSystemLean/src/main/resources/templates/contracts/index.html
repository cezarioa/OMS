<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contracts - OMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/customers">Customers</a>
    <a href="/orders">Orders</a>
    <a href="/contracts">Contracts</a>
</nav>

<div class="container">
    <h1>Contracts</h1>

    <div class="filter-panel">
        <form action="/contracts" method="get" class="filter-grid">
            <div>
                <label for="name">Contract Name</label>
                <input type="text" id="name" name="name" th:value="${name}" placeholder="Search by name">
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="" th:selected="${status == null}">All statuses</option>
                    <option th:each="opt : ${statusOptions}"
                            th:value="${opt.name()}"
                            th:text="${opt}"
                            th:selected="${opt == status}"></option>
                </select>
            </div>
            <div>
                <label for="contractType">Contract Type</label>
                <input type="text" id="contractType" name="contractType" th:value="${contractType}" placeholder="Type name">
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Filter</button>
                <a href="/contracts" class="btn btn-link">Reset</a>
            </div>
            <input type="hidden" name="sortBy" th:value="${sortBy}">
            <input type="hidden" name="sortDir" th:value="${sortDir}">
        </form>
    </div>

    <p>
        <a href="/contracts/new" class="btn btn-primary">Add New Contract</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>
                <a th:href="@{/contracts(sortBy='id', sortDir=${sortBy == 'id' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, status=${status}, contractType=${contractType})}">
                    ID <span th:if="${sortBy == 'id'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/contracts(sortBy='name', sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, status=${status}, contractType=${contractType})}">
                    Name <span th:if="${sortBy == 'name'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/contracts(sortBy='status', sortDir=${sortBy == 'status' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, status=${status}, contractType=${contractType})}">
                    Status <span th:if="${sortBy == 'status'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/contracts(sortBy='contractType.name', sortDir=${sortBy == 'contractType.name' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${name}, status=${status}, contractType=${contractType})}">
                    Contract Type <span th:if="${sortBy == 'contractType.name'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Lines</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${contracts}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.name}">Main Contract</td>
            <td th:text="${c.status}">Active</td>
            <td th:text="${c.contractType != null ? c.contractType.name : '—'}">Type</td>
            <td th:text="${#lists.size(c.contractLines)}">0</td>
            <td>
                <a th:href="@{/contracts/{id}(id=${c.id})}" class="btn btn-primary" style="margin-right: 5px;">Details</a>
                <a th:href="@{/contracts/{id}/edit(id=${c.id})}" class="btn btn-primary" style="margin-right: 5px;">Edit</a>
                <form th:action="@{/contracts/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete" onclick="return confirm('Delete this contract?');">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(contracts)}">
            <td colspan="6" style="text-align:center;">No contracts match the current filters.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
