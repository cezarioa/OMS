<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contracts</title>
    <style>
        table { border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .navbar { background-color: #005a9c; padding: 15px 30px; color: white; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-right: 20px; }
        .navbar a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/customers">Customers</a>
    <a href="/orders">Orders</a>
    <a href="/contracts">Contracts</a>
</nav>

<h1>Contract List</h1>
<p>
    <a href="/contracts/new">Add New Contract</a>
    &nbsp;|&nbsp;
    <a href="/customers">Customers</a>
    &nbsp;|&nbsp;
    <a href="/orders">Orders</a>
</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Contract Type</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contracts}">
        <td th:text="${c.id}">1</td>
        <td th:text="${c.name}">Main</td>
        <td th:text="${c.status}">Active</td>
        <td th:text="${c.contractType != null ? c.contractType.name : 'N/A'}">0</td>
        <td>
            <a th:href="@{/contracts/{id}(id=${c.id})}" style="margin-right: 5px; background-color: #007bff; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px;">Details</a>
            <a th:href="@{/contracts/{id}/edit(id=${c.id})}" style="margin-right: 5px; background-color: #007bff; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px;">Edit</a>
            <form th:action="@{/contracts/{id}/delete(id=${c.id})}" method="post" style="display: inline;">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
