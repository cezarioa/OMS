<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contracts</title>
    <style>
        table { border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Contract List</h1>
<p>
    <a href="/contracts/new">Add New Contract</a>
    &nbsp;|&nbsp;
    <a href="/customers">Customers</a>
    &nbsp;|&nbsp;
    <a href="/orders">Orders</a>
  </p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Status</th>
        <th>Lines (#)</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contracts}">
        <td th:text="${c.id}">1</td>
        <td th:text="${c.name}">Main</td>
        <td th:text="${c.description}">Desc</td>
        <td th:text="${c.status}">Active</td>
        <td th:text="${#lists.size(c.contractLines)}">0</td>
        <td>
            <form th:action="@{'/contracts/' + ${c.id} + '/delete'}" method="post">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
  </table>

</body>
</html>
