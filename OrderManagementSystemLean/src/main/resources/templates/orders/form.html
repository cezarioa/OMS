<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Order</title>
    <style>
        label { display: inline-block; width: 160px; margin-bottom: 6px; }
        input, select { padding: 4px; }
        .row { margin: 6px 0; }
        .navbar { background-color: #005a9c; padding: 15px 30px; color: white; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-right: 20px; }
        .navbar a:hover { text-decoration: underline; }
        .error { color: #dc3545; font-size: 0.85em; margin-left: 160px; display: block; }
        .lines-section { margin-top: 24px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fff; }
        .lines-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .lines-table th, .lines-table td { padding: 8px 6px; border: 1px solid #d9dde1; text-align: left; }
        .lines-table th { background-color: #f0f4f8; }
        .lines-table select, .lines-table input { width: 100%; }
        .unit-value { font-weight: 600; color: #004a80; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/customers">Customers</a>
    <a href="/orders">Orders</a>
    <a href="/contracts">Contracts</a>
</nav>

<h1 th:text="${order.id != null ? 'Edit Order' : 'Create Order'}">Create Order</h1>
<p>
    <a href="/orders">Back to Orders</a>
</p>

<form th:action="@{/orders}" th:object="${order}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div class="row">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" />
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>
    </div>

    <div class="row">
        <label for="shippingAddress">Shipping Address:</label>
        <input type="text" id="shippingAddress" th:field="*{shippingAddress}" />
        <span class="error" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}">Address error</span>
    </div>

    <div class="row">
        <label for="customerSelect">Customer:</label>
        <select id="customerSelect" th:field="*{customer.id}">
            <option value="" disabled>Select a customer</option>
            <option th:each="c : ${customers}" th:value="${c.id}"
                    th:text="${c.id + ' - ' + c.name}">1 - Example</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('customer.id')}" th:errors="*{customer.id}">Customer error</span>
    </div>

    <div class="row">
        <label for="contractSelect">Contract (optional):</label>
        <select id="contractSelect" th:field="*{contract.id}">
            <!-- FIXED: Changed th:value="" to value="" -->
            <option value="">None</option>
            <option th:each="c : ${contracts}" th:value="${c.id}"
                    th:text="${c.id + ' - ' + c.name}">1 - Example</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('contract.id')}" th:errors="*{contract.id}">Contract error</span>
    </div>

    <div class="lines-section">
        <h2>Order Lines</h2>
        <p>Pick the items, units, and quantities that make up this order. Quantity must be greater than zero.</p>
        <table class="lines-table">
            <thead>
            <tr>
                <th>Item / Service</th>
                <th>Unit</th>
                <th>Quantity</th>
                <th>Unit Value</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line, iterStat : ${order.orderLines}">
                <td>
                    <input type="hidden" th:field="*{orderLines[__${iterStat.index}__].id}" />
                    <select th:field="*{orderLines[__${iterStat.index}__].item}">
                        <option value="">Choose item</option>
                        <option th:each="item : ${sellableItems}"
                                th:value="${item.id}"
                                th:text="${item.name}">
                            Sample
                        </option>
                    </select>
                </td>
                <td>
                    <select th:field="*{orderLines[__${iterStat.index}__].unit}">
                        <option value="">Choose unit</option>
                        <option th:each="unit : ${units}"
                                th:value="${unit.id}"
                                th:text="${unit.symbol != null ? unit.symbol : unit.name}">
                            EA
                        </option>
                    </select>
                </td>
                <td>
                    <input type="number" step="0.1" placeholder="Qty"
                           th:field="*{orderLines[__${iterStat.index}__].quantity}" />
                </td>
                <td>
                    <span class="unit-value"
                          th:text="${line.item != null ? line.item.unitValue : 0.0}">0.0</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="row">
        <button type="submit">Save</button>
    </div>
</form>

</body>
</html>
