<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <style>
        table { border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Order List</h1>
<p>
    <a href="/orders/new">Add New Order</a>
    &nbsp;|&nbsp;
    <a href="/customers">Customers</a>
    &nbsp;|&nbsp;
    <a href="/contracts">Contracts</a>
  </p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Shipping Address</th>
        <th>Lines (#)</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${orders}">
        <td th:text="${o.id}">1</td>
        <td th:text="${o.name}">Order A</td>
        <td th:text="${o.shippingAddress}">Address</td>
        <td th:text="${#lists.size(o.orderLines)}">0</td>
        <td>
            <form th:action="@{'/orders/' + ${o.id} + '/delete'}" method="post">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
  </table>

</body>
</html>
